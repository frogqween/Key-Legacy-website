<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Properties | Key Legacy Realty</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="src/css/groth-theme.css">
</head>
<body>
    <nav>
        <a href="index.html" class="logo">Key Legacy Realty</a>
        <div class="nav-links">
            <a href="properties.html">Properties</a>
            <a href="services.html">Services</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </div>
    </nav>

    <main class="container">
        <section>
            <h1>Properties</h1>
            <p>Available rentals in Philadelphia.</p>
        </section>

        <section>
            <div style="display: flex; gap: 12px; margin-bottom: 24px; flex-wrap: wrap;">
                <select id="bedroomFilter">
                    <option value="">All Bedrooms</option>
                    <option value="1">1 Bed</option>
                    <option value="2">2 Bed</option>
                    <option value="3">3+ Bed</option>
                </select>
                <select id="priceFilter">
                    <option value="">Any Price</option>
                    <option value="0-1200">Under $1,200</option>
                    <option value="1200-1800">$1,200-$1,800</option>
                    <option value="1800-9999">$1,800+</option>
                </select>
                <span id="count" class="text-muted"></span>
            </div>
            <div class="grid-3" id="propertiesGrid"></div>
        </section>
    </main>

    <footer>
        <div class="container">
            <div class="footer-grid">
                <div>
                    <h4>Company</h4>
                    <a href="about.html">About</a>
                    <a href="agents.html">Team</a>
                    <a href="contact.html">Contact</a>
                </div>
                <div>
                    <h4>Services</h4>
                    <a href="services.html">Management</a>
                    <a href="buyers.html">Buyers</a>
                </div>
                <div>
                    <h4>Contact</h4>
                    <a href="tel:2673148006">(267) 314-8006</a>
                    <a href="mailto:hello@keylegacyrealty.com">Email</a>
                </div>
                <div>
                    <h4>Location</h4>
                    <p>Philadelphia, PA</p>
                </div>
            </div>
        </div>
    </footer>

    <script src="data/properties-source.js"></script>
    <script>
        const properties = window.PROPERTIES_DATA || [];
        let bedFilter = '', priceFilter = '';

        function render() {
            const filtered = properties.filter(p => {
                if (bedFilter && bedFilter !== '3' && p.beds != bedFilter) return false;
                if (bedFilter === '3' && p.beds < 3) return false;
                if (priceFilter) {
                    const [min, max] = priceFilter.split('-').map(Number);
                    if (p.rent < min || p.rent > max) return false;
                }
                return true;
            });

            document.getElementById('count').textContent = filtered.length + ' properties';
            document.getElementById('propertiesGrid').innerHTML = filtered.map(p => {
                const img = p.img ? (p.img.startsWith('http') ? p.img : `https://keylegacyrealty.managebuilding.com/Resident/api/public/files/download?fileName=${p.img}&isPreview=true`) : 'assets/images/Key Home Page.jpg';
                return `<a href="https://keylegacyrealty.managebuilding.com${p.url}" target="_blank" class="property-card">
                    <img src="${img}" alt="${p.address}">
                    <h3>${p.address}</h3>
                    <p>${p.beds} bed · ${p.baths} bath · <span class="price">$${p.rent.toLocaleString()}/mo</span></p>
                </a>`;
            }).join('') || '<p>No properties found.</p>';
        }

        document.getElementById('bedroomFilter').onchange = e => { bedFilter = e.target.value; render(); };
        document.getElementById('priceFilter').onchange = e => { priceFilter = e.target.value; render(); };
        render();
    </script>
</body>
</html>
