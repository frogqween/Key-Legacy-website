<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Key Legacy Realty | Philadelphia Rentals</title>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="src/css/te-core.css?v=5">
    <link rel="stylesheet" href="src/css/te-nav.css?v=5">

    <style>
        /* Specific page overrides */
        body.landing-page {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        .hero-section {
            width: 100%;
            height: calc(100vh - 60px);
            background-color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            position: fixed;
            top: 0;
            left: 0;
            overflow: hidden;
        }

        .hero-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center bottom;
        }

        /* Hero text overlay like reference */
        .hero-overlay {
            position: absolute;
            bottom: 15%;
            left: 0;
            right: 0;
            text-align: center;
            z-index: 10;
        }

        .hero-title {
            font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 56px;
            font-weight: 600;
            letter-spacing: 0.1em;
            color: #ffffff;
            text-transform: uppercase;
            margin: 0 0 14px 0;
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.3);
        }

        .hero-subtitle {
            font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 16px;
            font-weight: 500;
            letter-spacing: 0.06em;
            color: rgba(255, 255, 255, 0.9);
            margin: 0;
            text-shadow: 0 1px 10px rgba(0, 0, 0, 0.3);
        }

        /* Responsive Styles */
        @media (max-width: 900px) {
            .hero-title {
                font-size: 48px;
            }

            .hero-subtitle {
                font-size: 15px;
            }
        }

        @media (max-width: 680px) {
            .hero-section {
                height: calc(100vh - 55px);
            }

            .hero-title {
                font-size: 38px;
                letter-spacing: 0.08em;
            }

            .hero-subtitle {
                font-size: 14px;
            }

            .hero-overlay {
                bottom: 12%;
                padding: 0 20px;
            }
        }

        @media (max-width: 480px) {
            .hero-section {
                height: calc(100vh - 50px);
            }

            .hero-title {
                font-size: 32px;
                letter-spacing: 0.06em;
                margin-bottom: 10px;
            }

            .hero-subtitle {
                font-size: 13px;
                letter-spacing: 0.04em;
            }

            .hero-overlay {
                bottom: 10%;
            }
        }

        @media (max-width: 360px) {
            .hero-title {
                font-size: 28px;
            }

            .hero-subtitle {
                font-size: 12px;
            }
        }
    </style>
</head>

<body class="landing-page">

    <!-- Navigation -->
    <header class="te-nav">
        <div class="te-nav-primary">
            <nav class="nav-links">
                <div class="nav-item">
                    <a href="index.html" class="nav-main">
                        <span class="nav-main-text">key legacy</span>
                        <span class="nav-sub-inline">realty</span>
                    </a>
                </div>
                <div class="nav-item">
                    <a href="index.html" class="nav-main">home</a>
                </div>
                <div class="nav-item">
                    <a href="properties.html" class="nav-main">properties</a>
                </div>
                <div class="nav-item">
                    <a href="services.html" class="nav-main">services</a>
                </div>
                <div class="nav-item">
                    <a href="form.html" class="nav-main">forms</a>
                </div>
                <div class="nav-item">
                    <a href="about.html" class="nav-main">about</a>
                </div>
                <div class="nav-item">
                    <a href="contact.html" class="nav-main">contact</a>
                </div>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main>
        <section class="hero-section">
            <picture>
                <source srcset="assets/images/Key Home Page.avif" type="image/avif">
                <img src="assets/images/Key Home Page.jpg" alt="Key Legacy Realty" class="hero-image">
            </picture>
            <div class="hero-overlay">
                <h1 class="hero-title">Key Legacy</h1>
                <p class="hero-subtitle">Philadelphia Rental Properties</p>
            </div>
        </section>
    </main>
</body>

</html>
